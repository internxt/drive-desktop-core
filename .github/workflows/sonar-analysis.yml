name: Sonar analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  sonar_analysis:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:cov

      - name: Run report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@8ab049ff5a2c6e78f78af446329379b318544a1a # v2.8.3

      # TEMPORARY: Sonar scan disabled because SONAR_TOKEN is unavailable.
      # Restore when the token is available again.
      - name: SonarQube Scan - temporarily bypassed
        run: echo "SonarQube scan temporarily disabled because SONAR_TOKEN is unavailable."
