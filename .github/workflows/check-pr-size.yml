name: Check PR size

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check_pr_size:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate changed lines
        id: diff_check
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          MERGE_BASE=$(git merge-base "$HEAD_SHA" "$BASE_SHA")
          echo "Merge Base: $MERGE_BASE"

          TOTAL_CHANGED=$(git diff --numstat "$MERGE_BASE" "$HEAD_SHA" \
            | grep -Ev "(package-lock.json)" \
            | awk '{ added += $1; deleted += $2 } END { print added + deleted }')

          TOTAL_CHANGED=${TOTAL_CHANGED:-0}
          echo "Total changed lines: $TOTAL_CHANGED"

          echo "total=$TOTAL_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Temporary bypass PR size limit
        run: |
          echo "PR size check temporarily bypassed."
          echo "PR has ${{ steps.diff_check.outputs.total }} changed lines."
